# certdeploy 설정 예시 → /etc/certdeploy/certdeploy.yml 로 복사해 수정 (권한 640, 소유자 certdeploy)
# 비밀번호·토큰은 이 파일에 쓰지 않는다: 키스토어 비밀번호는 환경변수 이름(password_env)으로만 참조한다.

state_dir: /var/lib/certdeploy         # 배포 기록·잠금 파일 (권한 700)

# ---- 인증서 발급(lego). 없으면 이미 발급된 파일(certificate.cert_file/key_file)만 배포한다.
lego:
  binary: lego
  email: cert-admin@univ.example
  dns_provider: infoblox               # 지원 목록·환경변수 확인: lego dnshelp -c infoblox
  domains: ["univ.example", "*.univ.example"]
  path: /var/lib/lego                  # 계정·인증서 저장소(개인키 포함, 권한 700)
  env_file: /etc/lego/lego.env         # DNS 업체 계정 등 (KEY=VALUE, 권한 600)
  renew_days: 30                       # 만료 30일 이내일 때만 실제 갱신
  # server: https://acme-staging-v02.api.letsencrypt.org/directory   # 시험용(스테이징). 운영은 생략
  # dns_resolvers: ["10.0.0.53:53"]    # 위임 영역을 직접 질의할 권한 DNS

# lego 를 쓰지 않고 직접 배치한 파일을 배포하려면 아래를 사용(lego 설정이 있으면 자동 계산됨)
# certificate:
#   cert_file: /var/lib/lego/certificates/_.univ.example.crt   # 서버 인증서 + 중간 CA(fullchain)
#   key_file:  /var/lib/lego/certificates/_.univ.example.key
#   key_password_env: ""

notify:
  alertmanager_url: http://127.0.0.1:9093    # 배포 실패 시 CertDeployFailed 알림(성공하면 자동 해소)

options:
  verify_attempts: 6        # 재로드 후 새 인증서가 보일 때까지 재시도 횟수
  verify_interval: 5        # 재시도 간격(초)
  keep_backups: 3           # 파일별 백업 보관 개수
  min_days: 1

# ---- 배포 대상. canary 와 order 순서로 한 대씩 진행하고, 실패하면 이후 대상은 실행하지 않는다.
targets:
  # Apache: 기본 점검(configtest)과 재로드(systemctl reload httpd/apache2)가 내장되어 있다.
  - name: web-canary
    type: apache
    canary: true
    order: 1
    transport: {kind: ssh, host: www1.univ.example, user: deploy, key_file: /var/lib/certdeploy/.ssh/id_ed25519,
                known_hosts: /var/lib/certdeploy/.ssh/known_hosts}
    cert_path: /etc/ssl/univ/fullchain.pem     # SSLCertificateFile (서버+중간 CA)
    key_path: /etc/ssl/univ/privkey.pem        # SSLCertificateKeyFile
    verify: {host: www1.univ.example, port: 443}

  - name: web-main
    type: apache
    order: 2
    transport: {kind: ssh, host: www2.univ.example, user: deploy, key_file: /var/lib/certdeploy/.ssh/id_ed25519,
                known_hosts: /var/lib/certdeploy/.ssh/known_hosts}
    cert_path: /etc/ssl/univ/fullchain.pem
    key_path: /etc/ssl/univ/privkey.pem
    reload_cmd: sudo -n systemctl reload httpd       # 최소 권한: sudoers 에 이 명령만 허용(문서 참고)
    verify: {host: www2.univ.example, port: 443}

  # nginx
  # - name: proxy1
  #   type: nginx
  #   transport: {kind: ssh, host: proxy1.univ.example, user: deploy, ...}
  #   cert_path: /etc/nginx/ssl/fullchain.pem
  #   key_path: /etc/nginx/ssl/privkey.pem
  #   verify: {host: proxy1.univ.example}

  # Tomcat: PKCS#12 키스토어 교체 (비밀번호는 환경변수 TOMCAT_KS_PASS — /etc/certdeploy/env 에 둔다)
  - name: sugang-tomcat
    type: tomcat
    format: pkcs12                 # pkcs12 | jks | pem
    keystore_path: /opt/tomcat/conf/ssl/keystore.p12
    password_env: TOMCAT_KS_PASS
    alias: tomcat
    # legacy_pkcs12: true          # 구형 JVM(Java 8 초기)이 못 읽을 때만
    transport: {kind: ssh, host: sugang.univ.example, user: deploy, key_file: /var/lib/certdeploy/.ssh/id_ed25519,
                known_hosts: /var/lib/certdeploy/.ssh/known_hosts}
    reload_cmd: sudo -n systemctl restart tomcat     # Tomcat 버전별 재로드 방식은 제품 문서로 확인(없으면 재시작)
    verify: {host: sugang.univ.example, port: 8443}

  # WebtoB / JEUS 등 제품 고유 구성: generic 유형으로 파일 목록과 명령을 직접 지정한다.
  # (경로·형식·재기동 명령은 제품 문서와 현재 설정을 확인해 채운다 — 아래는 형태만 보여 주는 예시)
  # - name: jeus-sso
  #   type: generic
  #   transport: {kind: ssh, host: sso.univ.example, user: deploy, key_file: ..., known_hosts: ...}
  #   files:
  #     - {path: /opt/jeus/domains/sso/config/security/keystore.jks, content: jks, password_env: JEUS_KS_PASS, alias: sso}
  #   check_cmd: "true"                          # 점검 명령이 없으면 none
  #   reload_cmd: sudo -n /opt/jeus/bin/restart-sso.sh   # TODO: 실제 재기동 명령
  #   verify: {host: sso.univ.example, port: 443}

  # 같은 서버(발급 서버 자신)에 배포: transport 생략 또는 {kind: local}
  # - name: self-nginx
  #   type: nginx
  #   cert_path: /etc/ssl/univ/fullchain.pem
  #   key_path: /etc/ssl/univ/privkey.pem
