# 웹방화벽(WAF)·로드밸런서·어플라이언스 배포 예시 — type: http_api (제품 관리 API 를 설정으로 기술)
# 옵션: A=HTTP API(이 파일의 waf-main), B=SSH CLI(아래 주석 C 예시), C=사람이 교체 → certdeploy.waf-manual.example.yml
# ※ 아래 경로·필드명·응답 형식은 "구조를 보여 주는 가상 예시"다. 실제 제품(WAPPLES, WEBFRONT, FortiWeb, F5 등)의 관리 API 문서와
#    장비로 확인해 url/필드를 바꿔야 한다. API 가 없는 장비는 아래 SSH(generic) 방식이나 GUI 수동 교체를 쓴다.
#    docs/ops/compatibility.md 참고.
state_dir: /var/lib/certdeploy

certificate:
  cert_file: /var/lib/certdeploy/managed/wildcard.crt
  key_file: /var/lib/certdeploy/managed/wildcard.key

targets:
  # --- (A) REST API 로 올리는 WAF: 로그인 → 업로드 → 적용 → TLS 로 서빙 확인, 실패하면 이전 인증서로 롤백
  - name: waf-main
    type: http_api
    canary: true
    order: 1
    api:
      base_url: https://waf-mgmt.hnu.kr:8443
      ca_file: /etc/pki/ca-trust/source/anchors/waf-mgmt-ca.pem    # 관리 화면이 사설 인증서면 그 CA(또는 verify_tls: false — 비권장)
      vars: {cert_name: hnu-wildcard}
      steps:
        - name: login
          method: POST
          url: /api/login
          json: {user: "{env:WAF_USER}", password: "{env:WAF_PASS}"}     # 계정은 환경변수(/etc/certdeploy/env)에서
          expect_json: {"$.code": 0}                                      # HTTP 200 이어도 본문 코드가 실패일 수 있음
          extract: {token: "$.data.token"}                                # 응답에서 토큰 추출 → 이후 {token}
        - name: upload
          method: POST
          url: /api/ssl/cert
          headers: {Authorization: "Bearer {token}"}
          json: {name: "{cert_name}", cert: "{fullchain_pem}", key: "{key_pem}"}
          expect_json: {"$.code": 0}
        - name: apply
          method: POST
          url: /api/ssl/apply
          headers: {Authorization: "Bearer {token}"}
          json: {name: "{cert_name}"}
      rollback_steps:                                                      # 실패 시 직전 성공 배포본({prev_*})으로 되돌림
        - name: rollback-upload
          method: POST
          url: /api/ssl/cert
          headers: {Authorization: "Bearer {token}"}
          json: {name: "{cert_name}", cert: "{prev_fullchain_pem}", key: "{prev_key_pem}"}
        - name: rollback-apply
          method: POST
          url: /api/ssl/apply
          headers: {Authorization: "Bearer {token}"}
          json: {name: "{cert_name}"}
      finally_steps:                                                       # 성공·실패와 무관하게 항상(로그아웃)
        - name: logout
          method: POST
          url: /api/logout
          headers: {Authorization: "Bearer {token}"}
    verify: {host: www.hnu.kr, port: 443, strict: true}                    # WAF 앞단(VIP)에서 실제로 새 인증서가 서빙되는지 확인

  # --- (B) 파일 업로드(multipart)·PFX 를 요구하는 장비 예: multipart 와 {pfx_b64}/{pfx_password} 사용
  # - name: waf-sub
