# 수동 구매 인증서(와일드카드 등) + 자동 배포용 설정 — DNS(Infoblox)·lego 연동 없음. **도메인별로 인증서를 나눈 구성**
# 복사:  sudo cp certdeploy/certdeploy.manual.example.yml /etc/certdeploy/certdeploy.yml
# 흐름:  certdeploy --cert hnu csr → CA 제출 → certdeploy --cert hnu import --deploy   (docs/ops/certdeploy.md 5-1, docs/ops/vm-install-and-test.md)
# 비밀번호·토큰은 이 파일에 쓰지 않는다. 메일·개인키 보호 암호는 관리자 화면(발급·배포 설정)에서 입력하거나 /etc/certdeploy/env 의 환경변수로 둔다.

state_dir: /var/lib/certdeploy
audit_log: /var/lib/certdeploy/audit            # 변조 탐지 해시 체인 감사 로그(검증: certdeploy verify-audit)

# 관리 서버(같은 VM)의 감시 스택으로 결과 전달
notify:
  alertmanager_url: http://127.0.0.1:9093
  pushgateway_url: http://127.0.0.1:9091
  # 메일(우선 채널): **관리자 화면 > 발급·배포 설정 > 메일 알림**에서 입력하면 아래보다 우선한다(화면 없이 쓰려면 이 줄을 켠다)
  # smtp: {host: smtp.hnu.kr, port: 587, starttls: true, from: cert-deploy@hnu.kr, to: [cert-admin@hnu.kr], username: cert-deploy, password_env: SMTP_PASSWORD, on_success: true}
  # webhook: {url_env: CERTDEPLOY_WEBHOOK_URL, format: teams}      # Teams 는 이후 추가

defaults:
  transport: {kind: ssh, user: deploy, key_file: /var/lib/certdeploy/.ssh/id_ed25519, known_hosts: /var/lib/certdeploy/.ssh/known_hosts}

options:
  verify_attempts: 6
  verify_interval: 5
  keep_backups: 3

# 도메인(인증서)별로 키·배포 대상·개인키 보호 설정이 분리된다. 처음에는 시험용 1대(canary)만 두고 preflight → deploy → 확인 후 대상을 늘린다.
certificates:
  - name: hnu
    certificate:
      cert_file: /var/lib/certdeploy/hnu/managed/wildcard.crt
      key_file: /var/lib/certdeploy/hnu/managed/wildcard.key
      # 개인키 보호(암호 사용/사용 안 함)는 관리자 화면에서 인증서별로 선택한다. 화면 없이 쓰려면:
      # key_encryption: passphrase
      # key_password_env: CERTDEPLOY_KEY_PASSPHRASE_HNU
    targets:
      - name: hnu-web-canary
        type: apache
        canary: true
        order: 1
        transport: {host: www1.hnu.kr}
        cert_path: /etc/ssl/hnu/fullchain.pem
        key_path: /etc/ssl/hnu/privkey.pem
        reload_cmd: sudo -n systemctl reload httpd
        verify: {host: www1.hnu.kr, port: 443, strict: true}
      # - name: hnu-sugang-tomcat
      #   type: tomcat
      #   format: pkcs12
      #   keystore_path: /opt/tomcat/conf/ssl/keystore.p12
      #   password_env: TOMCAT_KS_PASS
      #   transport: {host: sugang.hnu.kr}
      #   reload_cmd: sudo -n systemctl restart tomcat
      #   verify: {host: sugang.hnu.kr, port: 8443}

  - name: hannam
    certificate:
      cert_file: /var/lib/certdeploy/hannam/managed/wildcard.crt
      key_file: /var/lib/certdeploy/hannam/managed/wildcard.key
    targets:
      - name: hannam-web-canary
        type: apache
        canary: true
        order: 1
        transport: {host: www.hannam.ac.kr}
        cert_path: /etc/ssl/hannam/fullchain.pem
        key_path: /etc/ssl/hannam/privkey.pem
        reload_cmd: sudo -n systemctl reload httpd
        verify: {host: www.hannam.ac.kr, port: 443, strict: true}

# (선택) 갱신본을 서버에 배포하기 전에 담당자 승인을 요구하려면 주석을 풀어 최상위(모든 인증서) 또는 인증서 항목 안에 둔다.
# 설치 매뉴얼 10-2 참고. 승인 전에는 배포되지 않고 알림이 간다(종료 코드 5).
