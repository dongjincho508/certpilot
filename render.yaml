# Render 블루프린트. DB·감사 로그는 /data 에 저장되므로 영구 디스크가 필요하다(유료 플랜).
services:
  - type: web
    name: certpilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: CERTPILOT_ADMIN_USER
        value: admin
      - key: CERTPILOT_ADMIN_PASSWORD
        sync: false            # 대시보드에서 직접 입력 (저장소에 커밋하지 않는다)
      - key: CERTPILOT_SECURE_COOKIE
        value: "1"
    disk:
      name: certpilot-data
      mountPath: /data
      sizeGB: 1
