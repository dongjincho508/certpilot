# CertPilot Manager - Render 배포 설정
# CertPilot 매니페스트 관리 서버 - 멀티 컨테이너 구성
version: '3.8'

services:
  - type: web
    name: certpilot-api
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: CERTPILOT_API_PORT
        value: "8080"
      - key: CERTPILOT_DATA_DIR
        value: /data
      - key: CERTPILOT_LOG_DIR
        value: /var/log/certpilot
      - key: CERTPILOT_AUTH_MODE
        value: disabled
      - key: CERTPILOT_SSH_KEY_DIR
        value: /data/config/keys
      - key: CERTPILOT_DB_URL
        value: sqlite:///data/certpilot.db
