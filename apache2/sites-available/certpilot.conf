# CertPilot Manager - Apache 가상 호스트 설정

<VirtualHost *:80>
    ServerAdmin admin@certpilot.local
    ServerName certpilot.local

    # 로그 설정
    ErrorLog ${APACHE_LOG_DIR}/certpilot-error.log
    CustomLog ${APACHE_LOG_DIR}/certpilot-access.log combined

    # 인증서 저장소 (맵핑 규칙)
    Alias /certs /data/certs
    <Directory /data/certs>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 로그 저장소
    Alias /logs /var/log/certpilot
    <Directory /var/log/certpilot>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 프론트엔드 정적 파일 (Apache에서 서빙)
    Alias /static /app/frontend/static
    <Directory /app/frontend/static>
        Options -Indexes
        Require all granted
    </Directory>

    # 프론트엔드 (템플릿)
    Alias / /app/frontend/templates/
    <Directory /app/frontend/templates>
        Options -Indexes
        Require all granted
    </Directory>

    # Flask API 프록시 설정
    ProxyPreserveHost On
    ProxyPass /api/ http://localhost:8080/
    ProxyPassReverse /api/ http://localhost:8080/

    # 헬스체크 엔드포인트
    ProxyPass /health http://localhost:8080/health
    ProxyPassReverse /health http://localhost:8080/health

    # 일반 엔드포인트
    ProxyPass /servers http://localhost:8080/servers
    ProxyPassReverse /servers http://localhost:8080/servers
    ProxyPass /servers/ http://localhost:8080/servers/
    ProxyPassReverse /servers/ http://localhost:8080/servers/

    # 기타 엔드포인트
    ProxyPass /audit-logs http://localhost:8080/audit-logs
    ProxyPassReverse /audit-logs http://localhost:8080/audit-logs
</VirtualHost>
