# promtool test rules — certdeploy 지표 기반 알림(시간 단위 척도). 평가 간격을 1시간으로 두어 며칠 단위 시나리오를 빠르게 검증한다.
rule_files:
  - ../rules/certdeploy.yml
evaluation_interval: 1h

tests:
  - name: 정체 - 마지막 성공이 3일/7일 넘으면 단계별 발동
    interval: 1h
    input_series:
      # 시각 0 = 마지막 성공. 아래 시리즈는 상수(마지막 성공 시각 0)이므로 경과 = 평가 시각
      - series: 'certdeploy_last_success_timestamp_seconds{cert="wildcard"}'
        values: '0+0x400'
      - series: 'certdeploy_last_success_timestamp_seconds{cert="portal"}'
        values: '604800+0x400'           # 7일 시점에 성공한 것으로 간주(= 이후 경과는 더 짧음)
    alert_rule_test:
      - eval_time: 48h                   # 2일: 아직 아님
        alertname: CertDeployStale
        exp_alerts: []
      - eval_time: 80h                   # 3일 8시간(+for 30m 충족)
        alertname: CertDeployStale
        exp_alerts:
          - exp_labels: {severity: warning, cert: wildcard}
            exp_annotations:
              summary: "certdeploy 성공 실행이 3일 넘게 없음: wildcard"
              description: "wildcard 의 마지막 정상 실행 이후 3d 8h 0m 0s 지났습니다. 타이머·서버·실패 원인을 확인하세요."
      - eval_time: 80h
        alertname: CertDeployStaleCritical
        exp_alerts: []
      - eval_time: 170h                  # 7일 2시간
        alertname: CertDeployStaleCritical
        exp_alerts:
          - exp_labels: {severity: critical, cert: wildcard}
            exp_annotations:
              summary: "certdeploy 성공 실행이 7일 넘게 없음: wildcard"
              description: "wildcard 의 마지막 정상 실행 이후 7d 2h 0m 0s 지났습니다. 인증서 갱신이 중단되었을 수 있습니다."

  - name: 실행 중단(데드맨)과 연속 발급 실패
    interval: 1h
    input_series:
      - series: 'certdeploy_last_run_timestamp_seconds{cert="wildcard"}'
        values: '0+0x100'
      - series: 'certdeploy_issue_failures{cert="wildcard"}'
        values: '0 1 2 2 2 0+0x95'
      - series: 'up{job="pushgateway",instance="pushgateway:9091"}'
        values: '1 1 0+0x97'
    alert_rule_test:
      - eval_time: 60h                   # 2.5일간 실행 기록 없음
        alertname: CertDeployNotRunning
        exp_alerts:
          - exp_labels: {severity: warning, cert: wildcard}
            exp_annotations:
              summary: "certdeploy 가 이틀 넘게 실행되지 않음: wildcard"
              description: "마지막 실행 이후 2d 12h 0m 0s 지났습니다. systemd 타이머(certdeploy-renew.timer)와 발급 서버 상태를 확인하세요."
      - eval_time: 4h                    # 연속 실패 2 이상이 5분 넘게 지속
        alertname: CertDeployIssueFailing
        exp_alerts:
          - exp_labels: {severity: warning, cert: wildcard}
            exp_annotations:
              summary: "인증서 발급·갱신이 연속 실패 중: wildcard"
              description: "wildcard 인증서 발급/갱신이 연속 2회 실패했습니다(DNS-01 연동·속도 제한·네트워크 확인)."
      - eval_time: 10h                   # 성공해 0 으로 복귀
        alertname: CertDeployIssueFailing
        exp_alerts: []
      - eval_time: 5h
        alertname: CertDeployPushgatewayDown
        exp_alerts:
          - exp_labels: {severity: warning, job: pushgateway, instance: "pushgateway:9091"}
            exp_annotations:
              summary: "Pushgateway 중단"
              description: "Pushgateway 가 응답하지 않아 certdeploy 결과를 수집할 수 없습니다."

  - name: 수동 교체 대기 - 1일 초과 경고, 3일 초과 긴급, 완료되면 해소
    interval: 1h
    input_series:
      # 시각 0 에 안내(pending_since=0). waf 는 100시간 뒤(= 값 0) 교체 완료로 대기 해제, 나머지는 계속 대기
      - series: 'certdeploy_target_manual_pending{cert="hnu",target="waf"}'
        values: '1+0x99 0+0x300'
      - series: 'certdeploy_target_manual_pending_since_timestamp_seconds{cert="hnu",target="waf"}'
        values: '0+0x400'
      - series: 'certdeploy_target_manual_pending{cert="hnu",target="new-pending"}'
        values: '0+0x20 1+0x380'
      - series: 'certdeploy_target_manual_pending_since_timestamp_seconds{cert="hnu",target="new-pending"}'
        values: '72000+0x400'            # 20시간 시점에 안내
    alert_rule_test:
      - eval_time: 20h                   # 1일 미만: 아직 아님
        alertname: CertDeployManualReplacementPending
        exp_alerts: []
      - eval_time: 30h                   # waf 는 1일 초과(+for 10m 충족), new-pending 은 10시간 경과라 제외
        alertname: CertDeployManualReplacementPending
        exp_alerts:
          - exp_labels: {severity: warning, cert: hnu, target: waf}
            exp_annotations:
              summary: "수동 교체 대기 1일 초과: hnu/waf"
              description: "waf 장비의 인증서를 직접 교체해야 하는데 안내 후 하루가 넘게 지났습니다. 교체 후 certdeploy deploy --target waf (또는 confirm)으로 완료를 기록하세요."
      - eval_time: 30h
        alertname: CertDeployManualReplacementOverdue
        exp_alerts: []
      - eval_time: 80h                   # 3일 초과 → 긴급
        alertname: CertDeployManualReplacementOverdue
        exp_alerts:
          - exp_labels: {severity: critical, cert: hnu, target: waf}
            exp_annotations:
              summary: "수동 교체 대기 3일 초과: hnu/waf"
              description: "waf 장비의 인증서 수동 교체가 3일 넘게 지연되고 있습니다. 만료 전에 교체되도록 담당자를 확인하세요."
      - eval_time: 110h                  # waf 는 교체 완료(값 0)로 해소, new-pending 은 91시간 경과(3일 초과)
        alertname: CertDeployManualReplacementOverdue
        exp_alerts:
          - exp_labels: {severity: critical, cert: hnu, target: new-pending}
            exp_annotations:
              summary: "수동 교체 대기 3일 초과: hnu/new-pending"
              description: "new-pending 장비의 인증서 수동 교체가 3일 넘게 지연되고 있습니다. 만료 전에 교체되도록 담당자를 확인하세요."

  - name: 배포 승인 - 1일 초과 대기는 경고, 3일 초과는 치명, 승인 후 해소
    interval: 1h
    input_series:
      - series: 'certdeploy_approval_pending{cert="hnu"}'
        values: '1x100 0x20'
      - series: 'certdeploy_approval_pending_since_timestamp_seconds{cert="hnu"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 12h
        alertname: CertDeployApprovalPending
        exp_alerts: []
      - eval_time: 26h
        alertname: CertDeployApprovalPending
        exp_alerts:
          - exp_labels: {severity: warning, cert: hnu}
            exp_annotations:
              summary: "배포 승인 대기 1일 초과: hnu"
              description: "hnu 인증서 갱신본의 배포 승인이 하루 넘게 대기 중입니다. 관리자 화면 '발급·배포 설정' 또는 `certdeploy approve` 로 승인/반려하세요."
      - eval_time: 26h
        alertname: CertDeployApprovalPendingLong
        exp_alerts: []
      - eval_time: 75h
        alertname: CertDeployApprovalPendingLong
        exp_alerts:
          - exp_labels: {severity: critical, cert: hnu}
            exp_annotations:
              summary: "배포 승인 대기 3일 초과: hnu"
              description: "hnu 의 승인이 3일 넘게 지연되고 있습니다. 승인 요청은 유효 시간이 지나면 만료되고 갱신본이 배포되지 않습니다."
      - eval_time: 110h
        alertname: CertDeployApprovalPending
        exp_alerts: []

  - name: 백업 - 실패는 즉시 치명, 이틀 넘게 성공 없으면 치명, 성공하면 해소
    interval: 1h
    input_series:
      - series: 'certdeploy_backup_ok{cert="backup"}'
        values: '1x10 0x20 1x80'
      - series: 'certdeploy_backup_last_success_timestamp_seconds{cert="backup"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 5h
        alertname: CertBackupFailed
        exp_alerts: []
      - eval_time: 15h
        alertname: CertBackupFailed
        exp_alerts:
          - exp_labels: {severity: critical, cert: backup}
            exp_annotations:
              summary: "관리 서버 백업 실패"
              description: "마지막 백업이 실패했거나 외부 복사에 실패했습니다. `certdeploy backup-status` 와 `journalctl -u certdeploy-backup` 를 확인하세요."
      - eval_time: 60h
        alertname: CertBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, cert: backup}
            exp_annotations:
              summary: "관리 서버 백업이 이틀 넘게 성공하지 못함"
              description: "마지막 성공 이후 2d 12h 0m 0s 지났습니다. 백업 타이머(certdeploy-backup.timer)와 저장 공간·외부 대상을 확인하세요."
      - eval_time: 45h
        alertname: CertBackupFailed
        exp_alerts: []
